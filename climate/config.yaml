schema_version: 6

dataset:
  name: projections-cordex-domains-single-levels
  provider: Copernicus Climate Data Store
  project: CORDEX
  domain_id: EUR-11
  domain: europe
  horizontal_resolution: 0_11_degree_x_0_11_degree
  temporal_resolution: daily_mean
  cds_url: https://cds.climate.copernicus.eu/datasets/projections-cordex-domains-single-levels
  doi: 10.24381/cds.bc91edc3
  catalogue_version: latest
  cordex_file_version: v2
  licence_url: https://cds.climate.copernicus.eu/datasets/projections-cordex-domains-single-levels?tab=download
  variables:
    temperature: tas
    solar_radiation: rsds

model_chain:
  gcm_model: cnrm_cerfacs_cm5
  rcm_model: cnrm_aladin63
  ensemble_member: r1i1p1

spatial_extraction:
  method: nearest_point
  target_lat: 50.85
  target_lon: 4.35
  selected_lat: 50.79848111186651
  selected_lon: 4.269705300227394
  selected_indices:
    x: 11
    y: 13
  full_domain_indices:
    x: 191
    y: 239
  cds_area_subset:
    west: 2.4
    south: 49.4
    east: 6.5
    north: 51.6

physical_ranges:
  temperature_C: [-35.0, 50.0]
  solar_W_m2: [0.0, 1500.0]

solar_alpha_safety:
  minimum: 0.7
  maximum: 1.3

scenario_baselines:
  rcp_2_6: rcp_2_6_baseline
  rcp_4_5: rcp_4_5_baseline
  rcp_8_5: rcp_8_5_baseline

provenance:
  legacy_model_root: /Users/alex/Library/CloudStorage/OneDrive-VrijeUniversiteitBrussel/Documenten/VUB/MA IW/Master Thesis/Legacy Models/model_v3
  single_chain_caveat: This is a single GCM-RCM-member sensitivity study. It samples RCP forcing and paired observed weather years, but it does not sample structural climate-model uncertainty and is not a probabilistic climate projection.
  observed_anchor_caveat: Each 2041-2060 scenario climatology is differenced against its matching 2006-2023 CORDEX scenario branch and applied to the same 2006-2023 PVGIS period. Matching the periods removes the former one-year temporal-anchor mismatch, while delta morphing still retains the observed point-weather distribution rather than reproducing the CORDEX absolute baseline.
  weather_ensemble_caveat: The 54 members form a paired deterministic empirical weather-year ensemble (18 PVGIS years repeated across 3 RCPs), not 54 independent Monte Carlo samples.

cordex_processing:
  script: climate.src.prepare_cordex
  output_directory: data/processed/cordex/daily
  manifest: data/processed/cordex/cordex_daily_manifest.json
  timestamp_convention: daily mean stamped at 12:00:00
  temperature_conversion: T_out_C = tas_K - 273.15
  solar_conversion: none

